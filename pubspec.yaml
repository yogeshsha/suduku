name: suduko
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.5+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fludoku: ^4.0.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0
  distribute_cli: ^2.3.5
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
    - assets/branding/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FF7A45"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFF6EC"
  image: assets/branding/splash_logo.png
  color_dark: "#170F2E"
  image_dark: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_logo.png
    icon_background_color: "#FFF6EC"
    image_dark: assets/branding/splash_logo.png
    icon_background_color_dark: "#170F2E"
  android: true
  ios: true
  web: false
  fullscreen: true
